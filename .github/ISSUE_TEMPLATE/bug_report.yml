name: Bug report
description: Report a problem with godownload
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for taking the time to report a bug.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the problem, including the error message.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Minimal code or manifest that reproduces the issue.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: godownload version
      placeholder: v2.0.0
    validations:
      required: true
  - type: input
    id: go-version
    attributes:
      label: Go version
      placeholder: '1.25'
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
