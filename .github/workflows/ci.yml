name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.27']
    env:
      # The CLI and example binaries are built with -cover and write
      # their coverage data here, so `go test -coverprofile` cannot
      # collect it on its own
      CLITEST_GOCOVERDIR: /tmp/subcover
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - name: Run tests
        run: |
          mkdir -p /tmp/subcover
          go test -race -coverprofile=coverage.txt -covermode=atomic ./...
          go tool covdata textfmt -i=/tmp/subcover -o=subprocess.txt
      - name: Upload coverage to Codecov
        if: matrix.go-version == '1.27'
        uses: codecov/codecov-action@v5
        with:
          files: coverage.txt,subprocess.txt
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

  vulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache: false
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        run: govulncheck ./...
